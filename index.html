<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, user-scalable=no">
  <title>Streaming Service</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/player.css">
</head>
<body class="mode-pointer">
  <div id="app">
    <!-- Apple TV Top-Left Search Navigation Pill (1:1 with Reference) -->
    <div class="top-nav-bar">
      <button id="top-nav-pill-btn" class="top-nav-pill-btn focusable" tabindex="0" aria-label="Search">
        <svg class="top-nav-chevron" viewBox="0 0 16 26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 3.5L4.5 13L11 22.5" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="top-nav-capsule">
          <div class="top-nav-icon-circle">
            <svg class="top-nav-search-icon" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="10.5" cy="10.5" r="6.8"></circle>
              <line x1="20" y1="20" x2="15.5" y2="15.5"></line>
            </svg>
          </div>
          <span class="top-nav-label">Search</span>
        </div>
      </button>
    </div>

    <!-- Apple TV Search Prompt Title (1:1 with Reference Image) -->
    <div class="search-prompt-header">
      <svg class="search-prompt-icon" viewBox="0 0 94 94" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M64.1 53.14L86.95 75.99A7.75 7.75 0 0 1 75.99 86.95L53.14 64.1A37.25 37.25 0 1 1 64.1 53.14ZM43.5 20.75A22.75 22.75 0 1 0 43.5 66.25A22.75 22.75 0 1 0 43.5 20.75Z" fill="currentColor"/>
      </svg>
      <h1 id="search-query-display" class="search-prompt-text empty">Movies, Shows, Cast, and More</h1>
    </div>

    <!-- Apple TV Keyboard Source Switcher Slider (1:1 with Reference Images) -->
    <div class="keyboard-source-switcher" role="tablist" aria-label="Keyboard Input Mode">
      <button id="kb-mode-abc" class="switcher-segment active focusable" role="tab" aria-selected="true" tabindex="0">abc</button>
      <button id="kb-mode-123" class="switcher-segment focusable" role="tab" aria-selected="false" tabindex="0">123</button>
    </div>
  </div>

  <!-- Core Scripts -->
  <script src="js/magic-remote.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/player.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/detail-view.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
